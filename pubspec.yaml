name: hola_professional
description: "HOLA Professional: salon booking, salon management and field sales app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  flutter_svg: ^2.2.1
  audioplayers: ^6.7.1
  url_launcher: ^6.3.1
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  share_plus: ^13.3.1
  pdf: ^3.13.1
  image: ^4.12.0
  gal: ^2.3.3
  local_auth: ^3.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device test runs (iPhone/Android), dev only; never shipped.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    # Wide geometric headings, after the HOLA Circle poster (SIL Open Font License).
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-500.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-600.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-700.ttf
          weight: 700
